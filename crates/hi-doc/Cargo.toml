[package]
name = "hi-doc"
description = "Diagnostics formatting library"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
unicode-box-drawing.workspace = true

smallvec.workspace = true
range-map.workspace = true
random_color.workspace = true
rand.workspace = true
num-traits.workspace = true
tree-sitter-highlight = { workspace = true, optional = true }
extension-trait.workspace = true
itertools.workspace = true
annotated-string.workspace = true

[dev-dependencies]
tree-sitter-rust.workspace = true

[features]
default = ["tree-sitter"]
tree-sitter = ["tree-sitter-highlight"]
